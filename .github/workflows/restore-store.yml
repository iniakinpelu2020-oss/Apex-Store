name: Restore store.js

# One-shot repair: an accidental commit replaced store.js with a placeholder.
# Rebuild store.js and README.md from the last good revision and mark Apex Links
# as ready in both.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-store.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild the catalog and README from the last good revision
        run: |
          git checkout 8d604fa9a46d39efa39354995bf268c9fdd6151b -- store.js README.md
          python3 - <<'PY'
          link_old = "path: '/apps/links/',      status: 'planned',"
          link_new = "path: '/apps/links/',      status: 'ready',  "

          text = open('store.js').read()
          assert text.count(link_old) == 1, text.count(link_old)
          open('store.js', 'w').write(text.replace(link_old, link_new))

          readme_old = (
              "Fourteen of the 25 are `Ready` today \u2014 Apex AI, Apex Sec, Apex Shield, Apex Camera, Apex\n"
              "Voice, Apex Video, Apex Pulse, Apex Vault, Apex Gallery, Apex Feed, Apex Notes, Apex Archive,\n"
              "Apex Planner and Apex Ledger \u2014 which with this store makes fifteen pages you can open today;\n"
              "two are `Preview` (Automation, Drive). The other nine are still marked `In progress`, and"
          )
          readme_new = (
              "Fifteen of the 25 are `Ready` today \u2014 Apex AI, Apex Sec, Apex Shield, Apex Camera, Apex\n"
              "Voice, Apex Video, Apex Pulse, Apex Vault, Apex Gallery, Apex Feed, Apex Notes, Apex Archive,\n"
              "Apex Planner, Apex Ledger and Apex Links \u2014 which with this store makes sixteen pages you can\n"
              "open today; two are `Preview` (Automation, Drive). The other eight are still marked\n"
              "`In progress`, and"
          )

          readme = open('README.md').read()
          assert readme.count(readme_old) == 1, readme.count(readme_old)
          open('README.md', 'w').write(readme.replace(readme_old, readme_new))
          PY
          node --check store.js

      - name: Commit the restored catalog
        run: |
          git config user.name "Apex Bot"
          git config user.email "apex-bot@users.noreply.github.com"
          git commit -am "Restore store.js and mark Apex Links as ready"
          git push
